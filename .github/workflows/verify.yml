name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_python.py
      - run: python tests/test_cli.py
      - run: python -m pip install .
      - run: codex-monitor --help
      - name: Verify Linux installer and isolated command
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux.sh
          "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor" --help
          test -L "$HOME/.local/bin/codex-monitor"
          CODEX_MONITOR_DEMO=1 "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor" serve --no-browser --port 7861 >/tmp/codex-monitor-linux.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do grep -q 'dashboard: http://' /tmp/codex-monitor-linux.log && break; sleep 0.25; done
          url=$(sed -n 's/^Codex Monitor dashboard: //p' /tmp/codex-monitor-linux.log | tail -1)
          test -n "$url"
          curl --fail --silent "$url" >/tmp/codex-monitor-linux.html
          grep -q 'account-grid' /tmp/codex-monitor-linux.html
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_store_tests.sh
      - run: bash tests/run_account_order_tests.sh
      - run: bash scripts/build.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "$(cat .last-build-path)" CodexMonitor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-macos
          path: CodexMonitor-macos.zip
