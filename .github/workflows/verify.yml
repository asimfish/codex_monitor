name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_python.py
      - run: python tests/test_cli.py
      - run: python tests/test_dashboard.py
      - run: python -m pip install .
      - run: codex-monitor --help
      - name: Verify Linux installer and isolated command
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux.sh
          "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor" --help
          test -L "$HOME/.local/bin/codex-monitor"
          python tests/check_installed_dashboard.py "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor"
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Verify real browser layout and tag interactions
        if: runner.os == 'Linux'
        run: SCREENSHOT_DIR=/tmp/dashboard-screenshots node tests/check_web_ui.mjs
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_store_tests.sh
      - run: bash tests/run_account_order_tests.sh
      - run: bash scripts/build.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "$(cat .last-build-path)" CodexMonitor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-macos
          path: CodexMonitor-macos.zip
