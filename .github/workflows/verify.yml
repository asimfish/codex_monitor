name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  git-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_git_policy.py
      - name: Verify incoming commits and runtime-data paths
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          policy_base="${PR_BASE:-origin/main}"
          if [[ "$GITHUB_REF" == "refs/heads/main" && -n "$PUSH_BASE" && "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]]; then
            policy_base="$PUSH_BASE"
          fi
          python scripts/check_git.py --base "$policy_base" --head "$REVIEW_HEAD" --branch "$REVIEW_BRANCH"
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_python.py
      - run: python tests/test_reset_credits.py
      - run: python tests/test_cli.py
      - run: python tests/test_web_regressions.py
      - run: python tests/test_recovery.py
      - run: python tests/test_login_retention.py
      - run: python tests/test_merge_compat.py
      - run: python tests/test_dashboard.py
      - run: python tests/test_removal.py
      - run: python tests/test_rename.py
      - run: python -m pip install .
      - run: codex-monitor --help
      - name: Verify Linux installer and isolated command
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux.sh
          "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor" --help
          test -L "$HOME/.local/bin/codex-monitor"
          python tests/check_installed_dashboard.py "$HOME/.local/share/codex-monitor/venv/bin/codex-monitor"
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Verify real browser layout and tag interactions
        if: runner.os == 'Linux'
        run: SCREENSHOT_DIR=/tmp/dashboard-screenshots node tests/check_web_ui.mjs
      - name: Verify isolated login browser cookie stores
        if: runner.os == 'Linux'
        run: node tests/check_browser_isolation.mjs
      - name: Verify recovery and failure journeys in Chromium
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-monitor-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/codex-monitor-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_ui.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_buttons.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_buttons.cjs --clipboard-only
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_buttons.cjs --modal-only
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_buttons.cjs --http-only
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/codex-monitor-browser/node_modules/playwright" node tests/test_web_buttons.cjs --http-only --reset-only
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_store_tests.sh
      - run: bash tests/run_account_order_tests.sh
      - run: bash tests/run_annotations_tests.sh
      - run: bash tests/run_login_tests.sh
      - run: bash scripts/build.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "$(cat .last-build-path)" CodexMonitor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-macos
          path: CodexMonitor-macos.zip
